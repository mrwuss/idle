# Publishes the game on every push to main: run the tests, then copy the static
# site (no build step) into the gh-pages branch, which GitHub Pages serves at
# https://mrwuss.github.io/idle/. A gh-pages branch switches Pages on by itself, so
# no repository setting is needed (if it ever isn't, Settings → Pages → Source:
# "Deploy from a branch", gh-pages / root).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy the site into a fresh gh-pages commit
        run: |
          mkdir _site
          cp -r index.html style.css src assets _site/
          touch _site/.nojekyll
          # Version the stylesheet and scripts so a phone that cached the old ones
          # (Pages serves max-age=600) can't mix them with a new index.html.
          sed -i -E "s#(href=\"style\.css|src=\"src/[a-z]+\.js)\"#\1?v=${GITHUB_SHA::7}\"#" _site/index.html
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
